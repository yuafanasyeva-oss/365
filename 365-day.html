const btn = document.getElementById("btn");
const note = document.getElementById("note");

// дата в формате YYYY-MM-DD
function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}

let startDay = localStorage.getItem("startDay");
if (!startDay) {
  startDay = todayKey();
  localStorage.setItem("startDay", startDay);
}

function daysBetween(a, b) {
  const d1 = new Date(a);
  const d2 = new Date(b);
  return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

const today = todayKey();
const opened = localStorage.getItem("openedDay");

const index = daysBetween(startDay, today);
const text = NOTES[index] || "Послания закончились 🤍";

if (opened === today) {
  note.textContent = localStorage.getItem("noteText");
  btn.disabled = true;
  btn.textContent = "Уже открыто сегодня";
}

btn.onclick = function () {
  note.textContent = text;
  localStorage.setItem("openedDay", today);
  localStorage.setItem("noteText", text);
  btn.disabled = true;
  btn.textContent = "До завтра";
};
</script>
